<!DOCTYPE html>
<html>
<head>
  <title>Horumar Platform</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px;
      border-bottom: 1px solid #333;
    }

    h1 {
      font-size: 40px;
      margin: 10px;
    }

    .hero {
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 32px;
    }

    .hero p {
      color: #bbb;
      font-size: 18px;
    }

    button {
      padding: 14px 28px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 16px;
      cursor: pointer;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 30px 20px;
    }

    .card {
      background: #171717;
      padding: 30px;
      width: 220px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Horumar</h1>
    <p>Schools • Offices • Organizations</p>
  </header>

  <section class="hero">
    <h2>Welcome to Horumar Platform</h2>
    <p>Hal meel oo lagu maamulo Schools, Offices iyo Organizations.</p>
    <button>Get Started</button>
  </section>

  <section class="cards">
    <div class="card">
      <h3>🏫 Schools</h3>
      <p>Maamul adeegyada iskuulka.</p>
    </div>

    <div class="card">
      <h3>🏢 Offices</h3>
      <p>Maamul xafiisyada iyo shaqada.</p>
    </div>

    <div class="card">
      <h3>👥 Organizations</h3>
      <p>Maamul ururrada iyo xubnaha.</p>
    </div>
  </section>

</body>
</html>
